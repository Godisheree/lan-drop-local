[package]
name = "lan-drop-core"
version = "0.1.0"
edition = "2021"
description = "Inti LAN DROP dalam Rust — port bertahap dari server Node (lihat docs/adr/0013)"
license = "MIT"
publish = false

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
getrandom = "0.2"
socket2 = { version = "0.5", features = ["all"] }
if-addrs = "0.13"
libc = "0.2"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "fs",
    "io-util",
    "time",
    "sync",
    "process",
    "signal",
] }
