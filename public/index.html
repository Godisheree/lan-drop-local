<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LAN DROP</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app" style="position:relative;z-index:1">
    <!-- Header -->
    <header id="header">
      <div class="logo">📡 LAN DROP</div>
      <div class="device-name" id="deviceName">—</div>
    </header>

    <!-- Main Layout -->
    <div id="main">
      <!-- Left: Device List -->
      <section id="devices-section">
        <h2>Perangkat Online</h2>
        <div id="deviceList" class="device-list">
          <p class="empty-msg" id="emptyDevices">🔍 Mencari perangkat lain di jaringan...</p>
        </div>
      </section>

      <!-- Right: Activity -->
      <section id="activity-section">
        <h2>Aktivitas Transfer</h2>
        <div id="transferList" class="transfer-list">
          <p class="empty-msg">Belum ada transfer.</p>
        </div>
      </section>
    </div>
  </div>

  <!-- Modal Incoming Request -->
  <div id="requestModal" class="modal hidden">
    <div class="modal-content">
      <h3>📥 Permintaan Masuk</h3>
      <p id="modalInfo"></p>
      <div class="modal-actions">
        <button id="btnAccept" class="btn btn-accept">✅ Terima</button>
        <button id="btnReject" class="btn btn-reject">❌ Tolak</button>
      </div>
    </div>
  </div>

  <!-- Modal Tulis Teks -->
  <div id="textComposerModal" class="modal hidden">
    <div class="modal-content text-composer">
      <div class="modal-header">
        <h3>✏️ Kirim Teks</h3>
        <button class="modal-x" id="btnCloseTextComposer">✕</button>
      </div>
      <p class="composer-target" id="textTargetName">ke —</p>
      <textarea id="textInput" rows="5" placeholder="Tulis pesan atau tempel tautan..." autocorrect="off"></textarea>
      <div class="char-count" id="charCount"></div>
      <div class="modal-actions">
        <button id="btnCancelText" class="btn btn-reject">Batal</button>
        <button id="btnSendText" class="btn btn-accept">📤 Kirim</button>
      </div>
    </div>
  </div>

  <!-- Overlay Teks Masuk — Auto-sizing dengan copy button pinned di bawah -->
  <div id="textOverlay" class="modal hidden">
    <div class="modal-content text-overlay" id="textOverlayContent">
      <div class="modal-header">
        <h3>💬 Teks dari <span id="textOverlaySender">—</span></h3>
        <button class="modal-x" id="btnCloseTextOverlay">✕</button>
      </div>
      <div id="textOverlayBody" class="text-body"></div>
      <div class="modal-actions">
        <button id="btnCopyText" class="btn btn-accept">📋 Salin</button>
      </div>
    </div>
  </div>

  <!-- Hidden file inputs untuk file picker -->
  <input type="file" id="mediaInput" accept="image/*,video/*" multiple style="display:none">
  <input type="file" id="fileInput" multiple style="display:none">

  <script src="client.js"></script>
</body>
</html>
